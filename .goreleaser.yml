# .goreleaser.yml
project_name: orbit
version: 2

before:
  hooks:
    # Build the React frontend and embed it into internal/api/static
    - bash -c "cd web && npm ci && npm run build"

builds:
  - id: orbit-amd64
    main: ./cmd/orbit
    binary: orbit
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: orbit-arm64
    main: ./cmd/orbit
    binary: orbit
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: orbit-armv7
    main: ./cmd/orbit
    binary: orbit
    env:
      - CGO_ENABLED=1
      - CC=arm-linux-gnueabihf-gcc
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: orbit
    builds:
      - orbit-amd64
      - orbit-arm64
      - orbit-armv7
    name_template: "orbit_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format: tar.gz
    files:
      - README.md
      - LICENSE
      - orbit.example.toml
      - scripts/install.sh

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: packages
    builds:
      - orbit-amd64
      - orbit-arm64
      - orbit-armv7
    package_name: orbit
    vendor: KenyanRedwoods01
    homepage: https://kenyanredwoods01.github.io/Orbit
    maintainer: KenyanRedwoods01 <https://github.com/KenyanRedwoods01>
    description: "Single-binary VPS management panel — metrics, deploy, firewall, MCP."
    license: AGPL-3.0
    formats:
      - deb
      - rpm
    contents:
      - src: orbit.example.toml
        dst: /etc/orbit/orbit.toml
        type: config|noreplace
      - src: packaging/orbit.service
        dst: /etc/systemd/system/orbit.service
    scripts:
      postinstall: "packaging/postinstall.sh"
      preremove:   "packaging/preremove.sh"

dockers:
  - id: orbit-docker-amd64
    use: buildx
    ids:
      - orbit-amd64
    image_templates:
      - "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}-amd64"
    dockerfile: packaging/Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"

  - id: orbit-docker-arm64
    use: buildx
    ids:
      - orbit-arm64
    image_templates:
      - "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}-arm64"
    dockerfile: packaging/Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}"
    image_templates:
      - "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}-amd64"
      - "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/kenyanredwoods01/orbit:latest"
    image_templates:
      - "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}-amd64"
      - "ghcr.io/kenyanredwoods01/orbit:{{ .Tag }}-arm64"

release:
  github:
    owner: KenyanRedwoods01
    name: Orbit
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
