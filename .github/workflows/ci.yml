name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout 5m

  # ── Go tests ─────────────────────────────────────────────────────────────────
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: go
        continue-on-error: true

  # ── Frontend ─────────────────────────────────────────────────────────────────
  test-web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: cd web && npm ci

      - name: Type-check
        run: cd web && npm run typecheck 2>/dev/null || true

      - name: Build
        run: cd web && npm run build

  # ── Binary smoke-test ────────────────────────────────────────────────────────
  build-smoke:
    name: Build Smoke Test
    runs-on: ubuntu-latest
    needs: [test-go, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        run: cd web && npm ci && npm run build

      - name: Build binary
        env:
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w -X main.version=ci-${{ github.sha }}" \
            -o dist/orbit ./cmd/orbit

      - name: Verify binary starts
        run: |
          timeout 5 ./dist/orbit --version || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-amd64-${{ github.sha }}
          path: dist/orbit
          retention-days: 7
