name: Advanced Test Flows

on:
  push:
    branches: [main]
  schedule:
    # Run full test matrix at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      go_version:
        description: 'Go version override'
        required: false
        default: ''
      node_version:
        description: 'Node.js version override'
        required: false
        default: '20'
      run_race:
        description: 'Run Go tests with -race'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

# ─── Jobs ────────────────────────────────────────────────────────────────────

jobs:
  # 1. Cross-version Go matrix ─────────────────────────────────────────────────
  go-matrix:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        os: [ubuntu-latest, ubuntu-22.04]
        exclude:
          # 1.23 on ubuntu-22.04 is redundant; keep matrix lean
          - go: '1.23'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version: ${{ inputs.go_version || matrix.go }}
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Run tests
        run: |
          FLAGS="-v -count=1 -timeout 120s -coverprofile=cov-${{ matrix.go }}.out"
          if [ "${{ inputs.run_race || 'true' }}" = "true" ]; then
            FLAGS="$FLAGS -race"
          fi
          go test $FLAGS ./internal/...

      - name: Upload coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: go-coverage-${{ matrix.go }}-${{ matrix.os }}
          path: cov-${{ matrix.go }}.out
          retention-days: 7

  # 2. Go fuzz targets (short fuzz, 30s each) ─────────────────────────────────
  go-fuzz:
    name: Go Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Fuzz validateDBIdentifier
        run: |
          go test ./internal/api/ -run=^$ -fuzz=FuzzValidateDBIdentifier -fuzztime=30s || true

      - name: Fuzz validateIP
        run: |
          go test ./internal/api/ -run=^$ -fuzz=FuzzValidateIP -fuzztime=30s || true

  # 3. Frontend cross-version Node matrix ──────────────────────────────────────
  frontend-matrix:
    name: Frontend / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: ${{ inputs.node_version || matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run test:ci
      - run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: matrix.node == '20'
        with:
          name: frontend-coverage-node${{ matrix.node }}
          path: web/coverage/
          retention-days: 7

  # 4. Security scan (govulncheck + Trivy) ─────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee govulncheck.txt

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@45775bd8235c68ba998cffa5171334d58593da47 # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: npm audit (frontend)
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high 2>&1 | tee npm-audit.txt || true

      - name: Upload scan artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: security-scan-results
          path: |
            govulncheck.txt
            trivy-results.sarif
            web/npm-audit.txt
          retention-days: 14

  # 5. Integration E2E — setup wizard + profile flow ────────────────────────────
  e2e-integration:
    name: E2E Integration — Full Auth Flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build binary
        run: |
          GOFLAGS="-buildvcs=false" go build -o orbit ./cmd/orbit/

      - name: Write E2E config
        run: |
          cat > orbit.e2e.toml <<'EOF'
          listen_addr = "127.0.0.1:3199"
          data_dir    = "/tmp/orbit-e2e"
          secret_key  = "e2e-test-key-orbit-2026-not-weak-aaaa-bbbbb"
          [modules]
          metrics  = true
          services = true
          security = true
          EOF

      - name: Start backend
        run: |
          ./orbit --config orbit.e2e.toml &
          echo $! > orbit.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3199/api/setup/status >/dev/null 2>&1 && echo "ready" && break
            sleep 0.5
          done

      - name: E2E — setup wizard
        run: |
          STATUS=$(curl -sf http://127.0.0.1:3199/api/setup/status)
          echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['setup_required']==True"
          curl -sf -X POST http://127.0.0.1:3199/api/setup/complete \
            -H 'Content-Type: application/json' \
            -d '{"username":"e2e-admin","password":"E2Etest#2026secure"}' | python3 -m json.tool

      - name: E2E — login flow
        run: |
          # Login
          curl -sf -X POST http://127.0.0.1:3199/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"e2e-admin","password":"E2Etest#2026secure"}' \
            -c /tmp/e2e-cookies.txt -b /tmp/e2e-cookies.txt \
            | python3 -m json.tool

          # Fetch CSRF token
          curl -sf http://127.0.0.1:3199/api/csrf-token \
            -b /tmp/e2e-cookies.txt \
            -o /tmp/csrf.json
          CSRF=$(python3 -c "import json; print(json.load(open('/tmp/csrf.json'))['csrf_token'])")
          echo "CSRF_TOKEN=${CSRF}" >> "$GITHUB_ENV"

      - name: E2E — profile read
        run: |
          PROFILE=$(curl -sf http://127.0.0.1:3199/api/profile -b /tmp/e2e-cookies.txt)
          echo "Profile: $PROFILE"
          echo "$PROFILE" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d['username']=='e2e-admin', f'username mismatch: {d}'
          print('Profile OK')
          "

      - name: E2E — profile update
        run: |
          curl -sf -X PUT http://127.0.0.1:3199/api/profile \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -b /tmp/e2e-cookies.txt \
            -d '{"display_name":"E2E Admin","email":"e2e@test.local","bio":"Integration test user"}' \
            | python3 -m json.tool

      - name: E2E — profile activity
        run: |
          ACT=$(curl -sf http://127.0.0.1:3199/api/profile/activity -b /tmp/e2e-cookies.txt)
          echo "Activity: $ACT"
          echo "$ACT" | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d,list)"

      - name: E2E — logout
        run: |
          curl -sf -X POST http://127.0.0.1:3199/api/auth/logout \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -b /tmp/e2e-cookies.txt

          # After logout, profile should return 401
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3199/api/profile -b /tmp/e2e-cookies.txt)
          echo "Post-logout profile status: $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 after logout, got $CODE"
            exit 1
          fi

      - name: Stop backend
        if: always()
        run: kill $(cat orbit.pid) 2>/dev/null || true

  # 6. Parallel coverage merge and badge ───────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [go-matrix, frontend-matrix]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: coverage/

      - name: Merge Go coverage profiles
        run: |
          go install golang.org/x/tools/cmd/gocovmerge@latest
          find coverage/ -name '*.out' | xargs gocovmerge > merged.out 2>/dev/null || \
            find coverage/ -name '*.out' | head -1 | xargs cp merged.out 2>/dev/null || \
            echo "mode: set" > merged.out
          go tool cover -func=merged.out | tail -1
          go tool cover -html=merged.out -o coverage/merged.html

      - name: Upload merged coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: coverage-merged
          path: |
            merged.out
            coverage/merged.html
          retention-days: 30
