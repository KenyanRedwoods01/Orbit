name: Release

on:
  push:
    tags:
      - "v*.*.*"

# SECURITY FIX: Top-level permissions set to read-only (least-privilege baseline).
# Each job declares only the specific write permissions it actually needs.
permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  # ── GoReleaser (builds amd64 + arm64 + armv7 with CGO cross-compilers) ──────
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to upload release assets
      packages: write      # needed to push image to GHCR
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0        # GoReleaser needs full history for changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # CGO cross-compilation requires these toolchains on the runner
      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            libc6-dev-arm64-cross \
            libc6-dev-armhf-cross

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Enrich release notes ───────────────────────────────────────────────────
  release-notes:
    name: Enrich release notes
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write      # needed to update the release body
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Update release body
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          append_body: true
          body: |

            ---

            ### Quick install (Linux — Ubuntu, Debian, CentOS, Rocky)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/KenyanRedwoods01/Orbit/${{ github.ref_name }}/scripts/install.sh | sudo bash
            ```

            ### Docker

            ```bash
            docker run -d \
              --name orbit \
              --cap-add NET_ADMIN \
              -p 5000:5000 \
              -v orbit-data:/var/lib/orbit \
              ghcr.io/kenyanredwoods01/orbit:${{ github.ref_name }}
            ```

            ### Checksums

            See `checksums.txt` attached to this release.

            ### Supported platforms

            | Archive | Architecture |
            |---------|-------------|
            | `orbit_linux_amd64.tar.gz` | x86-64 (most servers & VMs) |
            | `orbit_linux_arm64.tar.gz` | ARM 64-bit (Ampere, Graviton, Pi 4/5) |
            | `orbit_linux_armv7.tar.gz` | ARM 32-bit (older Raspberry Pi) |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
