name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  # ── GoReleaser (builds amd64 + arm64 + armv7 with CGO cross-compilers) ──────
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # GoReleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # CGO cross-compilation requires these toolchains on the runner
      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            libc6-dev-arm64-cross \
            libc6-dev-armhf-cross

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Enrich release notes ───────────────────────────────────────────────────
  release-notes:
    name: Enrich release notes
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |

            ---

            ### Quick install (Linux — Ubuntu, Debian, CentOS, Rocky)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/KenyanRedwoods01/Orbit/${{ github.ref_name }}/scripts/install.sh | sudo bash
            ```

            ### Docker

            ```bash
            docker run -d \
              --name orbit \
              --cap-add NET_ADMIN --cap-add SYS_PTRACE \
              -p 5000:5000 \
              -v orbit-data:/var/lib/orbit \
              ghcr.io/kenyanredwoods01/orbit:${{ github.ref_name }}
            ```

            ### Checksums

            See `checksums.txt` attached to this release.

            ### Supported platforms

            | Archive | Architecture |
            |---------|-------------|
            | `orbit_linux_amd64.tar.gz` | x86-64 (most servers & VMs) |
            | `orbit_linux_arm64.tar.gz` | ARM 64-bit (Ampere, Graviton, Pi 4/5) |
            | `orbit_linux_armv7.tar.gz` | ARM 32-bit (older Raspberry Pi) |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
