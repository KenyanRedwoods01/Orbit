name: Test Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── Go Backend Tests ────────────────────────────────────────────────────────
  go-test:
    name: Go Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy and download dependencies
        run: go mod tidy && go mod download

      - name: Run unit tests
        run: |
          go test -v -race -count=1 \
            -timeout 120s \
            -coverprofile=coverage.out \
            ./internal/... \
            2>&1 | tee test-results.txt

      - name: Generate coverage report
        if: success()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o coverage.html
          else
            echo "::warning::coverage.out not found, skipping HTML report"
            echo "mode: set" > coverage.out
            touch coverage.html
          fi

      - name: Check coverage threshold (≥60%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below 60% threshold"
          fi

      - name: Upload Go coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 7

  # ── Go Static Analysis ──────────────────────────────────────────────────────
  go-vet:
    name: Go Vet & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ── Frontend Tests ──────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest
        run: npm run test:ci

      - name: Upload frontend coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7

  # ── TypeScript Type Check ───────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  # ── ESLint ──────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  # ── Build Verification ──────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    needs: [frontend-test, typecheck, lint]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Upload built frontend
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: frontend-build
          path: internal/api/static/
          retention-days: 3

  build-backend:
    name: Go Backend Build
    runs-on: ubuntu-latest
    needs: [go-test, go-vet]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build orbit binary
        run: |
          GOFLAGS="-buildvcs=false" go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_SHA::8}" \
            -o orbit ./cmd/orbit/
      - name: Upload binary
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: orbit-binary-linux-amd64
          path: orbit
          retention-days: 3

  # ── Integration: Backend + Frontend together ─────────────────────────────────
  integration-smoke:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: orbit-binary-linux-amd64

      - name: Make binary executable
        run: chmod +x orbit

      - name: Write integration test config
        run: |
          cat > orbit.ci.toml <<'EOF'
          listen_addr = "127.0.0.1:3099"
          data_dir    = "/tmp/orbit-ci-test"
          secret_key  = "ci-integration-test-key-2026-not-weak-xxxxxxxx"
          [modules]
          metrics = true
          services = true
          security = true
          EOF

      - name: Start backend
        run: |
          ./orbit --config orbit.ci.toml &
          echo $! > orbit.pid
          # Wait up to 10s for server to be ready
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3099/api/setup/status >/dev/null 2>&1; then
              echo "Backend ready after ${i} attempts"
              break
            fi
            sleep 0.5
          done

      - name: Smoke test — setup status endpoint
        run: |
          STATUS=$(curl -sf http://127.0.0.1:3099/api/setup/status)
          echo "Setup status: $STATUS"
          echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'setup_required' in d, 'missing setup_required key'"

      - name: Smoke test — complete setup and login
        run: |
          # Complete setup
          SETUP=$(curl -sf -X POST http://127.0.0.1:3099/api/setup/complete \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"CItest2026!secure"}')
          echo "Setup: $SETUP"

          # Login and capture cookie
          curl -sf -X POST http://127.0.0.1:3099/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"CItest2026!secure"}' \
            -c /tmp/orbit-ci-cookies.txt
          echo "Login successful"

      - name: Smoke test — profile endpoint
        run: |
          PROFILE=$(curl -sf http://127.0.0.1:3099/api/profile \
            -b /tmp/orbit-ci-cookies.txt)
          echo "Profile: $PROFILE"
          echo "$PROFILE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['username'] == 'ci-admin', f'wrong user: {d}'"

      - name: Stop backend
        if: always()
        run: |
          [ -f orbit.pid ] && kill $(cat orbit.pid) || true

  # ── Summary ──────────────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [go-test, go-vet, frontend-test, typecheck, lint, integration-smoke]
    if: always()
    steps:
      - name: Report status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const jobs = [
              { name: 'Go Tests',          result: '${{ needs.go-test.result }}' },
              { name: 'Go Vet',            result: '${{ needs.go-vet.result }}' },
              { name: 'Frontend Tests',    result: '${{ needs.frontend-test.result }}' },
              { name: 'TypeScript Check',  result: '${{ needs.typecheck.result }}' },
              { name: 'ESLint',            result: '${{ needs.lint.result }}' },
              { name: 'Integration Smoke', result: '${{ needs.integration-smoke.result }}' },
            ];
            const icons = { success: '✅', failure: '❌', cancelled: '⚫', skipped: '⏭️' };
            const rows = jobs.map(j => `| ${icons[j.result] || '❓'} ${j.name} | ${j.result} |`).join('\n');
            const allPass = jobs.every(j => j.result === 'success');

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  `## ${allPass ? '✅' : '❌'} Test Pipeline Results`,
                  '',
                  '| Status | Job |',
                  '|--------|-----|',
                  rows,
                  '',
                  `**Overall:** ${allPass ? 'All checks passed' : 'Some checks failed — see above'}`,
                ].join('\n'),
              });
            }
