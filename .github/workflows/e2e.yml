name: E2E Tests (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # ── Build backend for E2E ─────────────────────────────────────────────────────
  build:
    name: Build Orbit Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: GOFLAGS="-buildvcs=false" go build -o orbit ./cmd/orbit/

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: orbit-e2e-binary
          path: orbit
          retention-days: 1

  # ── Playwright E2E ────────────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download binary
        uses: actions/download-artifact@fa0a91b85d4f404e444306234a0d1f1707950b57 # v4
        with:
          name: orbit-e2e-binary

      - name: Make executable
        run: chmod +x orbit

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Write E2E config
        run: |
          cat > orbit.e2e.toml <<'EOF'
          listen_addr = "127.0.0.1:3999"
          data_dir    = "/tmp/orbit-e2e-${{ matrix.shard }}"
          secret_key  = "e2e-playwright-orbit-2026-not-weak-aaaa-bbbbb-ccccc"
          [modules]
          metrics  = true
          services = true
          security = true
          logs     = true
          firewall = true
          EOF

      - name: Start backend
        run: |
          ./orbit --config orbit.e2e.toml &
          echo $! > orbit-e2e.pid
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3999/api/setup/status >/dev/null 2>&1 && break
            sleep 0.5
          done

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: |
          ORBIT_API_URL=http://127.0.0.1:3999 \
          npx playwright test \
            --shard=${{ matrix.shard }} \
            --reporter=html \
            2>&1 | tee playwright-results.txt || true
        working-directory: web
        env:
          CI: true

      - name: Stop backend
        if: always()
        run: kill $(cat orbit-e2e.pid) 2>/dev/null || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: playwright-report-shard-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/playwright-results.txt
          retention-days: 7

  # ── API-layer E2E (curl-based, no browser) ────────────────────────────────────
  api-e2e:
    name: API E2E (Full auth + profile flow)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download binary
        uses: actions/download-artifact@fa0a91b85d4f404e444306234a0d1f1707950b57 # v4
        with:
          name: orbit-e2e-binary

      - run: chmod +x orbit

      - name: Write config
        run: |
          cat > orbit.api.toml <<'EOF'
          listen_addr = "127.0.0.1:3899"
          data_dir    = "/tmp/orbit-api-e2e"
          secret_key  = "api-e2e-test-orbit-2026-not-weak-aaaa-bbbbb-ccccc"
          [modules]
          metrics  = true
          services = true
          security = true
          logs     = true
          firewall = true
          database = true
          EOF

      - name: Start backend
        run: |
          ./orbit --config orbit.api.toml &
          echo $! > orbit-api.pid
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3899/api/setup/status >/dev/null 2>&1 && break
            sleep 0.5
          done

      - name: E2E — setup status returns setup_required
        run: |
          STATUS=$(curl -sf http://127.0.0.1:3899/api/setup/status)
          echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['setup_required']==True, f'Expected true, got {d}'"

      - name: E2E — complete setup
        run: |
          RESULT=$(curl -sf -X POST http://127.0.0.1:3899/api/setup/complete \
            -H 'Content-Type: application/json' \
            -d '{"username":"e2e-admin","password":"E2Etest#2026secure"}')
          echo "Setup: $RESULT"

      - name: E2E — setup now complete
        run: |
          STATUS=$(curl -sf http://127.0.0.1:3899/api/setup/status)
          echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['setup_required']==False"

      - name: E2E — login
        run: |
          curl -sf -X POST http://127.0.0.1:3899/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"e2e-admin","password":"E2Etest#2026secure"}' \
            -c /tmp/e2e-api-cookies.txt -b /tmp/e2e-api-cookies.txt \
            | python3 -m json.tool

      - name: E2E — fetch CSRF token
        run: |
          curl -sf http://127.0.0.1:3899/api/csrf-token \
            -b /tmp/e2e-api-cookies.txt \
            -o /tmp/csrf.json
          CSRF=$(python3 -c "import json; print(json.load(open('/tmp/csrf.json'))['csrf_token'])")
          echo "CSRF_TOKEN=${CSRF}" >> "$GITHUB_ENV"

      - name: E2E — profile read
        run: |
          PROFILE=$(curl -sf http://127.0.0.1:3899/api/profile \
            -b /tmp/e2e-api-cookies.txt)
          echo "Profile: $PROFILE"
          echo "$PROFILE" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d['username']=='e2e-admin', f'wrong user: {d}'
          assert 'id' in d, 'missing id'
          assert 'role' in d, 'missing role'
          print('Profile OK')
          "

      - name: E2E — profile update
        run: |
          curl -sf -X PUT http://127.0.0.1:3899/api/profile \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -b /tmp/e2e-api-cookies.txt \
            -d '{"display_name":"E2E Admin","email":"e2e@test.local","bio":"Integration test user","avatar_color":"#3b82f6"}'
          echo "Profile update OK"

      - name: E2E — verify profile update persisted
        run: |
          PROFILE=$(curl -sf http://127.0.0.1:3899/api/profile \
            -b /tmp/e2e-api-cookies.txt)
          echo "$PROFILE" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d['display_name']=='E2E Admin', f'display_name not updated: {d}'
          assert d['email']=='e2e@test.local', f'email not updated: {d}'
          print('Profile update verified')
          "

      - name: E2E — profile sessions endpoint
        run: |
          SESS=$(curl -sf http://127.0.0.1:3899/api/profile/sessions \
            -b /tmp/e2e-api-cookies.txt)
          echo "Sessions: $SESS"
          echo "$SESS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d,list)"

      - name: E2E — profile activity endpoint
        run: |
          ACT=$(curl -sf http://127.0.0.1:3899/api/profile/activity \
            -b /tmp/e2e-api-cookies.txt)
          echo "Activity: $ACT"
          echo "$ACT" | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d,list)"

      - name: E2E — TOTP status endpoint
        run: |
          TOTP=$(curl -sf http://127.0.0.1:3899/api/auth/totp/status \
            -b /tmp/e2e-api-cookies.txt)
          echo "TOTP: $TOTP"
          echo "$TOTP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'enabled' in d"

      - name: E2E — unauthorized access is rejected (401)
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3899/api/profile)
          echo "Unauth profile status: $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for unauthenticated profile access, got $CODE"
            exit 1
          fi

      - name: E2E — logout
        run: |
          curl -sf -X POST http://127.0.0.1:3899/api/auth/logout \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -b /tmp/e2e-api-cookies.txt

      - name: E2E — post-logout access is rejected (401)
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3899/api/profile -b /tmp/e2e-api-cookies.txt)
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 after logout, got $CODE"
            exit 1
          fi
          echo "Post-logout 401 confirmed"

      - name: Stop backend
        if: always()
        run: kill $(cat orbit-api.pid) 2>/dev/null || true
